<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkVault</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>
        <div class="brand-text">
          <h1 class="brand-title">LinkVault</h1>
          <span class="brand-badge">Offline & Secure</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="openOptionsBtn" class="icon-btn" title="Open Settings & Options" aria-label="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Autofill Hero Section -->
    <section class="autofill-panel">
      <button id="autofillBtn" class="btn-primary autofill-btn" title="Detect and fill matching profile fields on the current webpage">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
        </svg>
        <span>Autofill Current Page</span>
      </button>

      <div class="autofill-options">
        <label class="checkbox-label" title="When unchecked, any field that already has text will NOT be overwritten">
          <input type="checkbox" id="overwriteToggle">
          <span class="custom-checkbox"></span>
          <span class="checkbox-text">Overwrite existing values</span>
        </label>
      </div>
    </section>

    <!-- Autofill Status Result Banner -->
    <div id="autofillResultBanner" class="result-banner hidden" role="status">
      <div class="result-banner-header">
        <span class="result-icon" id="resultBannerIcon"></span>
        <span class="result-title" id="resultBannerTitle">Autofill Result</span>
        <button id="closeBannerBtn" class="close-banner-btn" aria-label="Close notification">&times;</button>
      </div>
      <div class="result-details" id="resultBannerDetails"></div>
    </div>

    <!-- Search Bar -->
    <div class="search-bar">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="searchInput" placeholder="Search saved links..." autocomplete="off" spellcheck="false">
      <button id="clearSearchBtn" class="clear-search-btn hidden" title="Clear search" aria-label="Clear search">&times;</button>
    </div>

    <!-- Links Count / Filter Info -->
    <div class="section-meta">
      <span class="meta-title">Profile Links</span>
      <span class="meta-counter" id="linksCountBadge">0 links</span>
    </div>

    <!-- Links List -->
    <main class="links-list" id="linksListContainer" role="region" aria-label="Saved Links List">
      <!-- Cards rendered dynamically by popup.js -->
    </main>

    <!-- Empty State -->
    <div id="emptyState" class="empty-state hidden">
      <div class="empty-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          <line x1="8" y1="11" x2="14" y2="11"></line>
        </svg>
      </div>
      <h3 id="emptyStateTitle">No links found</h3>
      <p id="emptyStateText">Try a different search term or add a new link below.</p>
    </div>

    <!-- Footer Bar -->
    <footer class="app-footer">
      <button id="addNewLinkBtn" class="btn-secondary add-link-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span>Add Custom Link</span>
      </button>
      <button id="footerSettingsBtn" class="link-btn" title="Open full settings page">
        Manage All & Backup &rarr;
      </button>
    </footer>

    <!-- Toast Notification -->
    <div id="toastNotification" class="toast hidden" role="alert">
      <span id="toastIcon" class="toast-icon">✓</span>
      <span id="toastMessage" class="toast-message">Copied to clipboard!</span>
    </div>

    <!-- Edit/Add Modal Overlay -->
    <div id="linkModal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-card">
        <div class="modal-header">
          <h2 id="modalTitle" class="modal-title">Edit Link</h2>
          <button id="closeModalBtn" class="modal-close-btn" aria-label="Close dialog">&times;</button>
        </div>
        <form id="linkForm" class="modal-form" novalidate>
          <input type="hidden" id="editLinkId">
          <input type="hidden" id="editLinkType" value="custom">

          <div class="form-group" id="labelGroup">
            <label for="linkNameInput" class="form-label">Link Label <span class="required">*</span></label>
            <input type="text" id="linkNameInput" class="form-input" placeholder="e.g. Behance, Twitter, Portfolio" required>
            <span class="field-error hidden" id="labelError">Please provide a label.</span>
          </div>

          <div class="form-group">
            <label for="linkUrlInput" class="form-label">URL <span class="required">*</span></label>
            <input type="url" id="linkUrlInput" class="form-input" placeholder="https://example.com/username" required spellcheck="false">
            <span class="field-error hidden" id="urlError">Please enter a valid URL (e.g. https://...).</span>
          </div>

          <div class="form-group" id="keywordsGroup">
            <label for="linkKeywordsInput" class="form-label">Autofill Match Keywords <span class="label-hint">(optional)</span></label>
            <input type="text" id="linkKeywordsInput" class="form-input" placeholder="e.g. twitter, x profile, twitter url">
            <span class="input-tip">Comma-separated terms that match this form field.</span>
          </div>

          <div class="modal-actions">
            <button type="button" id="cancelModalBtn" class="btn-ghost">Cancel</button>
            <button type="submit" id="saveLinkBtn" class="btn-primary">Save Link</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
